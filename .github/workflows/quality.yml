name: Quality Gate

# Gerbang kualitas otomatis (audit 2026-10-24).
# Sebelum ini repo hanya punya workflow manual onboarding klien; perubahan kode
# bisa lolos tanpa lint/typecheck/test. Build produksi sengaja TIDAK dijalankan
# di sini karena prerender membaca D1 produksi (butuh kredensial asli); build
# diverifikasi oleh `npm run deploy` / `cf:build` di mesin owner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test
